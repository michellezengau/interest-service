name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m mypy app            # NEW: type checking

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                     # let every version finish, even if one fails
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --junitxml=reports/junit.xml   # coverage gate comes from pyproject.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: test-report-${{ matrix.python-version }}     # artifact names must be unique
          path: reports/
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install pip-audit
      - name: Audit runtime dependencies for known CVEs
        run: python -m pip_audit -r requirements.txt
      - name: Block PRs that add vulnerable dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
        with:
          fail-on-severity: high
  image:
    needs: [ lint, test, security ]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write          # push to GHCR
      id-token: write          # OIDC identity for keyless signing
      attestations: write      # store attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v5

      - name: Set image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Tools for building images for other CPU types
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1     # emulates arm64 on GitHub's amd64 runner
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # Docker's builder that supports multiple platforms

  # 1) Build an amd64 copy and keep it locally, so Trivy can scan it
      - name: Build (amd64) for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
           context: .
           platforms: linux/amd64
           load: true
           tags: ${{ env.IMAGE }}:${{ github.sha }}
           cache-from: type=gha
           cache-to: type=gha,mode=max
      - name: Scan image (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # latest release
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # ---- Everything below runs only on main: PRs verify, main releases ----
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # 2) Build for both CPU types and push them under ONE digest
      - name: Build and push (amd64 + arm64)
        if: github.ref == 'refs/heads/main'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
           context: .
           platforms: linux/amd64,linux/arm64
           push: true
           tags: ${{ env.IMAGE }}:${{ github.sha }}
           cache-from: type=gha       # reuses the amd64 layers that were just scanned
           provenance: false          # we create our own attestation below
           sbom: false                # we create our own SBOM below

      - name: Record digest
        if: github.ref == 'refs/heads/main'
        run: echo "Pushed $IMAGE@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"


      - name: Generate SBOM
        if: github.ref == 'refs/heads/main'
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56   # latest release
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest build provenance
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # latest release
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e   # latest release
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
  # One stable check for the ruleset to require (see Experiment C)
  ci-passed:
    if: always()                           # run even when earlier jobs fail or are skipped
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed"
            exit 1
          fi
  deploy-dev:
    if: github.ref == 'refs/heads/main'
    needs: [ image, ci-passed ]
    runs-on: ubuntu-latest
    environment: dev
    concurrency: { group: deploy-dev, cancel-in-progress: false }
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Verify provenance before deploying
        run: gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Deploy (run the promoted image) and smoke-test
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker run -d --name app -p 8000:8000 "$IMAGE@$DIGEST"
          for i in $(seq 1 20); do curl -fsS http://localhost:8000/health && exit 0; sleep 1; done
          docker logs app; exit 1
      - name: Record what was deployed
        run: echo "Deployed \`$IMAGE@$DIGEST\` to **dev**" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: [ image, deploy-dev ]
    runs-on: ubuntu-latest
    environment: staging
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Verify provenance before deploying
        run: gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Deploy (run the promoted image) and smoke-test
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker run -d --name app -p 8000:8000 "$IMAGE@$DIGEST"
          for i in $(seq 1 20); do curl -fsS http://localhost:8000/health && exit 0; sleep 1; done
          docker logs app; exit 1
      - name: Record what was deployed
        run: echo "Deployed \`$IMAGE@$DIGEST\` to **staging**" >> "$GITHUB_STEP_SUMMARY"

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: [ image, deploy-staging ]
    runs-on: ubuntu-latest
    environment: prod
    concurrency: { group: deploy-prod, cancel-in-progress: false }
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Verify provenance before deploying
        run: gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Deploy (run the promoted image) and smoke-test
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker run -d --name app -p 8000:8000 "$IMAGE@$DIGEST"
          for i in $(seq 1 20); do curl -fsS http://localhost:8000/health && exit 0; sleep 1; done
          docker logs app; exit 1
      - name: Record what was deployed
        run: echo "Deployed \`$IMAGE@$DIGEST\` to **production**" >> "$GITHUB_STEP_SUMMARY"