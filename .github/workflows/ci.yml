name: CI

on:
  pull_request:            # run on every PR: the gate before merge
  push:
    branches: [main]       # run again after merge, to prove main is green

permissions:
  contents: read           # least privilege for GITHUB_TOKEN

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    needs: lint            # only run tests if lint passes (fail fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -v --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()       # upload the report even when tests fail
        with:
          name: test-report
          path: reports/