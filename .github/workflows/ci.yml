name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m mypy app            # NEW: type checking

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                     # let every version finish, even if one fails
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --junitxml=reports/junit.xml   # coverage gate comes from pyproject.toml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ matrix.python-version }}     # artifact names must be unique
          path: reports/
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install pip-audit
      - name: Audit runtime dependencies for known CVEs
        run: python -m pip_audit -r requirements.txt
      - name: Block PRs that add vulnerable dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
  # One stable check for the ruleset to require (see Experiment C)
  ci-passed:
    if: always()                           # run even when earlier jobs fail or are skipped
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed"
            exit 1
          fi